worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr error;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    log_format arclis '$time_iso8601 $request_method $uri $status $request_time';
    access_log /dev/stdout arclis;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 2m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    limit_req_zone $binary_remote_addr zone=api_rate:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=api_connections:1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 127.0.0.1:8081;
        access_log off;
        root /srv/arclis;
        location = / {
            try_files /index.html =404;
        }
    }

    server {
        listen 8080;
        server_name localhost;
        if ($host != localhost) { return 400; }
        return 308 https://localhost:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name localhost;
        if ($host != localhost) { return 400; }
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;

        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_request_buffering on;
        limit_req_status 429;
        limit_conn_status 429;

        location /api/ {
            limit_req zone=api_rate burst=20 nodelay;
            limit_conn api_connections 12;
            proxy_pass http://backend:8000;
        }

        location /ws/ {
            limit_req zone=api_rate burst=20 nodelay;
            limit_conn api_connections 12;
            proxy_pass http://backend:8000;
        }

        location / {
            root /srv/arclis;
            try_files $uri $uri/ =404;
        }
    }
}
